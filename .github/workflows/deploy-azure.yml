name: Deploy to Azure Static Web Apps (manual, optional)

# Live deployment is optional for this assessment. This workflow only runs when started by hand:
# GitHub -> Actions -> "Deploy to Azure Static Web Apps" -> Run workflow.
# It needs ONE repository secret, created from the Azure portal. No credentials are stored in the repo.
#   AZURE_STATIC_WEB_APPS_API_TOKEN  (Static Web App -> Manage deployment token)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Deploy dist/ to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
